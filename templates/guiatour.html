<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{PONTO_NOME}} - GuiaTour</title>
    
    <!-- Meta Tags para SEO -->
    <meta name="description" content="{{PONTO_RESUMO}}">
    <meta property="og:title" content="{{PONTO_NOME}} - GuiaTour">
    <meta property="og:description" content="{{PONTO_RESUMO}}">
    <meta property="og:image" content="{{PONTO_CAPA_URL}}">
    <meta property="og:type" content="website">

    <!-- Leaflet CSS (Mapa) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Bootstrap ou seu CSS base -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        :root { --primary-color: #007bff; }
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('{{PONTO_CAPA_URL}}');
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }
        #map { height: 400px; border-radius: 12px; margin-bottom: 2rem; z-index: 1; }
        .merchant-card {
            transition: transform 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        .merchant-card:hover { transform: translateY(-5px); }
        .category-badge { font-size: 0.8rem; background: #e9ecef; padding: 4px 8px; border-radius: 20px; }
    </style>

    <!-- Schema.org para Google -->
    <script type="application/ld+json">
        {{SCHEMA_SEO}}
    </script>
</head>
<body>

    <!-- Hero -->
    <header class="hero-section">
        <div>
            <h1 class="display-3 fw-bold">{{PONTO_NOME}}</h1>
            <p class="lead"><i class="bi bi-geo-alt"></i> {{PONTO_CIDADE}} - {{PONTO_CATEGORIA}}</p>
        </div>
    </header>

    <main class="container my-5">
        <div class="row">
            <!-- Coluna Esquerda: História e Informações -->
            <div class="col-lg-8">
                <section class="mb-5">
                    <h2 class="mb-4">Sobre este local</h2>
                    <div class="lh-lg text-secondary">
                        {{PONTO_HISTORIA_HTML}}
                    </div>
                </section>

                <section>
                    <h2 class="mb-4">Localização</h2>
                    <div id="map"></div>
                </section>
            </div>

            <!-- Coluna Direita: Comerciantes Próximos -->
            <div class="col-lg-4">
                <div class="sticky-top" style="top: 20px;">
                    <h3 class="mb-4">Onde comer e comprar</h3>
                    <div id="comerciantes-container">
                        <!-- Gerado via JavaScript baseado no PONTO_JSON -->
                        <div class="text-center py-4">
                            <div class="spinner-border text-primary" role="status"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p>© 2024 GuiaTour - O seu guia turístico inteligente.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Placeholder injetado pelo Pascal (TPontoView)
        // Deve ser um objeto JSON válido: { "lat": -23.1, "lng": -44.1, "comerciantes": [...] }
        const PONTO_DATA = {{PONTO_JSON}};

        function initApp() {
            if (!PONTO_DATA) return;

            // 1. Inicializar Mapa
            const map = L.map('map').setView([PONTO_DATA.lat, PONTO_DATA.lng], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);

            // Marcador do Ponto Turístico
            const mainIcon = L.icon({
                iconUrl: 'https://cdn-icons-png.flaticon.com/512/684/684908.png',
                iconSize: [35, 35]
            });
            L.marker([PONTO_DATA.lat, PONTO_DATA.lng], {icon: mainIcon})
             .addTo(map)
             .bindPopup("<b>{{PONTO_NOME}}</b>").openPopup();

            // 2. Renderizar Comerciantes
            const container = document.getElementById('comerciantes-container');
            container.innerHTML = ''; // Limpar spinner

            if (PONTO_DATA.comerciantes && PONTO_DATA.comerciantes.length > 0) {
                PONTO_DATA.comerciantes.forEach(loja => {
                    // Adicionar marcador no mapa para a loja
                    L.marker([loja.lat, loja.lng])
                     .addTo(map)
                     .bindPopup(`<b>${loja.nome}</b><br>${loja.categoria}`);

                    // Criar card lateral
                    const card = `
                        <a href="/loja/${loja.slug}" class="card mb-3 merchant-card border-0 shadow-sm">
                            <div class="row g-0">
                                <div class="col-4">
                                    <img src="${loja.logo || 'https://via.placeholder.com/100'}" class="img-fluid rounded-start h-100 object-fit-cover" alt="${loja.nome}">
                                </div>
                                <div class="col-8">
                                    <div class="card-body p-2">
                                        <h6 class="card-title mb-1">${loja.nome}</h6>
                                        <span class="category-badge">${loja.categoria}</span>
                                        <p class="card-text mt-1 text-muted" style="font-size: 0.75rem;">
                                            <i class="bi bi-geo-alt"></i> a ${loja.distancia_metros}m
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </a>
                    `;
                    container.innerHTML += card;
                });
            } else {
                container.innerHTML = '<p class="text-muted">Nenhum estabelecimento próximo cadastrado ainda.</p>';
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
